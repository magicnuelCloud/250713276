<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div id="border">
    <h1>Formulir Pendaftaran Seminar</h1>
    <h2>Data Peserta</h2>
    <p class="intro">Lengkapi Informasi Berikut Untuk Melengkapi Data Pendaftaran Seminar.</p>
    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">

           
            <tr>
                <td class="field-name">
                    <label for="nama"><strong>Nama Lengkap</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30" />
                </td>
            </tr>
            
            <tr>
                <td class="field-name">
                    <label for="nim"><strong>NIM</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr>
            
            <tr>
                <td class="field-name">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-Laki" /><label for="laki">Laki-Laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" /><label for="perempuan">Perempuan</label>
                </td>
            </tr>
            
            <tr>
                <td class="field-name">
                    <label for="prodi"><strong>Program Studi</strong>
                    </label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
            
            
        </table>
    </form>

    <h2>Pilihan Seminar</h2>

    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">

           <tr>
                <td class="field-name">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler" name="tiket" value="Reguler" /><label for="reguler">Reguler</label>
                    <input type="radio" id="vip" name="tiket" value="VIP" /><label for="vip">VIP</label>
                </td>
            </tr>

            <tr>
                <td class="field-name" style="vertical-align: top;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="topik1" name="topik" value="Web Development" />
                        <label for="topik1">Web Development</label>
                    </p>
                    <p>
                        <input type="checkbox" id="topik2" name="topik" value="Data Science" />
                        <label for="topik2">Data Science</label>
                    </p>
                    <p>
                        <input type="checkbox" id="topik3" name="topik" value="Artificial Intelligence" />
                        <label for="topik3">Artificial Intelligence</label>
                    </p>
                    
                    
                </td>
            </tr>
        </table>
    </form>

    <h2>Informasi Tambahan</h2>

    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
           <tr>
                <td class="field-name" style="vertical-align: top;">
                    <label for="alasan"><strong>Alasan Mengikuti Seminar</strong>
                    </label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan"></textarea>
                </td>
            </tr>
            
            <tr>
                <td class="field-name">
                    <label for="bukti"><strong>Bukti Pembayaran</strong>
                    </label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" size="18" accept="image/gif, image/jpeg, image/png" />
                </td>
            </tr>
            <tr>
                <td colspan="2" class="submit-cell">
                    <input type="submit" name="simpan" value="Kirim Pendaftaran" />
                    <input type="reset" name="ulang" value="Kosongkan Form" />
                </td>
            </tr>
        </table>
    </form>

    <p class="footer">Terima Kasih Telah Mengisi Formulir Seminar, Pastikan Data Sudah Benar.</p>
    </div>
</body>
</html>
